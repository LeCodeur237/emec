name: Deploy EMEC Front Production

on:
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production

    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.egliseemec.org/api/v1' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Build static site
        run: |
          npm ci
          npm run build

      - name: Check deployment target
        run: |
          test -n "${{ vars.FRONTEND_TARGET_DIR }}"

      - name: Upload dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/*"
          target: ${{ vars.FRONTEND_TARGET_DIR }}
          strip_components: 1
          overwrite: true
          rm: false

      - name: Verify deployment directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            test -n "${{ vars.FRONTEND_TARGET_DIR }}"
            test -f "${{ vars.FRONTEND_TARGET_DIR }}/index.html"
            ls -lah "${{ vars.FRONTEND_TARGET_DIR }}" | head
